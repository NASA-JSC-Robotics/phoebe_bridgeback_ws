[workspace]
# Update the workspace name accordingly
name = "phoebe_bridgeback_ws"
authors = ["Erik Holum <erik.holum@nasa.gov>"]
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-aarch64", "linux-64"]
version = "0.1.0"

[activation]
# Sources the workspace install, if present
scripts = ["scripts/entrypoint_pixi.sh"]

[activation.env]
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
LDFLAGS = "-L${CONDA_PREFIX}/lib -Wl,-rpath,${CONDA_PREFIX}/lib -fuse-ld=mold"
COLCON_DEFAULT_OUTPUT_STYLE = "catkin_tools"
COLCON_DEFAULTS_FILE = "${PIXI_PROJECT_ROOT}/config/colcon-defaults.yaml"
RCUTILS_COLORIZED_OUTPUT = "1"

[tasks]
# Setup tasks
setup-colcon = { cmd = """
colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml && \
colcon mixin update default
""" }

# Build tasks
build = "colcon build"
test = "colcon test"
test-result = "colcon test-result --verbose"
clean = "rm -rf build/* install/* log/*"

[dependencies]
python = ">=3.11,<3.13"
cmake = ">=4.1.2,<5"
ccache = ">=4.13.1,<5"
ninja = ">=1.13.1,<2"
mold = ">=2.40.4,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
colcon-mixin = ">=0.2.3,<0.3"
pip = "*"
pyserial = ">=3.5,<4"
pytest = "<9.1.0"  # Avoids issues with plugin loading in colcon test
librealsense = ">=2.57.7,<3"
libserial = ">=1.0.0,<2"
urdf-parser-py = ">=0.0.4,<0.0.5"

# ROS dependencies
ros-jazzy-ros-base = "*"
ros-jazzy-backward-ros = "*"
ros-jazzy-controller-interface = "*"
ros-jazzy-python-qt-binding = "*"
ros-jazzy-mujoco-vendor = "*"
ros-jazzy-controller-manager = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-ros2-control-cmake = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-depth-image-proc = "*"
ros-jazzy-ros2-control-test-assets = "*"
ros-jazzy-control-toolbox = "*"
ros-jazzy-pcl-ros = "*"
ros-jazzy-realsense2-description = "*"
ros-jazzy-transmission-interface = "*"
ros-jazzy-clearpath-platform-description = "*"
ros-jazzy-ur-description = "*"
ros-jazzy-joy-linux = "*"
ros-jazzy-teleop-twist-joy = "*"
ros-jazzy-interactive-marker-twist-server = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-joint-trajectory-controller = "*"
ros-jazzy-gripper-controllers = "*"
ros-jazzy-joint-state-broadcaster = "*"
ros-jazzy-imu-sensor-broadcaster = "*"
ros-jazzy-force-torque-sensor-broadcaster = "*"
ros-jazzy-mecanum-drive-controller = "*"
ros-jazzy-ros2controlcli = "*"
ros-jazzy-pose-broadcaster = ">=4.40.0,<5"
ros-jazzy-forward-command-controller = ">=4.40.0,<5"

[pypi-dependencies]
obj2mjcf = ">=0.0.25, <0.0.26"
