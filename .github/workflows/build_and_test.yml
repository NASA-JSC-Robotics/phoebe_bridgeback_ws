name: build_and_test

on:
  push:
    tags:
      - '*'
    branches:
      - humble
      - jazzy
      - '*-devel'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - '*'
  workflow_dispatch:

# Do not run multiple jobs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  TAG: ${{ github.head_ref || github.ref_name }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      # These images are larger but we can free up some space in the runner image to make room for it.
      # Some of these are very slow, so only remove what is fast.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          dotnet: true
          tool-cache: false
          android: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Print info
        run: |
          echo "REPOSITORY_NAME: ${{ env.REPOSITORY_NAME }}"
          echo "TAG: ${{ env.TAG }}"
      # NOTE: This will not work for non-public submodules. Use a token and config substitution instead.
      - name: Checkout code
        uses: actions/checkout@v4
      # TODO: We won't need this once all submodules are public
      - name: Update submodules with a token
        run: |
          git config --global url."https://${{ secrets.IMETRO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --recursive --init
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # TODO: Use GHCR or Dockerhub to push images once these are public, for now we have added a layer
      # to the build file to enable testing during the build, rather than loading and running test here.
      # Additionally, exporting as a tarfile and importing saves space, so we do that rather than load the image.
      # It would be nice to not have to do those things but unfortunately GHCR is not free.
      - name: Build and load
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REPOSITORY_NAME }}:${{ env.TAG }}
          target: er4-dev-source
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ env.REPOSITORY_NAME }}_${{ env.TAG }}.tar
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      - name: Run tests
        run: |
          docker load --input /tmp/${{ env.REPOSITORY_NAME }}_${{ env.TAG }}.tar && \
          docker run --rm \
            ${{ env.REPOSITORY_NAME }}:${{ env.TAG }} \
            bash -c "
              colcon test --packages-skip clearpath_mecanum_drive_controller robotiq_driver && \
              colcon test-result --verbose
            "
